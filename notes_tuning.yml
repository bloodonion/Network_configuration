---

# Run these on the physical 100G interfaces (the bond slaves), not only on the bond:

# Check current max ring sizes
ethtool -g <iface>

# Increase ring buffers to maximum (common values 4096 or 8192)
ethtool -G <iface> rx <max> tx <max>

# Enable adaptive interrupt coalescing (recommended for throughput)
ethtool -C <iface> adaptive-rx on adaptive-tx on

# Optional: increase tx queue length
ip link set <iface> txqueuelen 10000


You can make these persistent with NetworkManager:

nmcli connection modify <conn-name> \
  ethtool.ring-rx 4096 \
  ethtool.ring-tx 4096 \
  ethtool.coalesce-adaptive-rx on \
  ethtool.coalesce-adaptive-tx on

#  2. Recommended Sysctl Settings
Create /etc/sysctl.d/99-100g-network.conf:
# .ini file
# TCP buffer sizes (good starting point for 100G)
net.core.rmem_max = 536870912
net.core.wmem_max = 536870912
net.core.rmem_default = 131072
net.core.wmem_default = 131072
net.ipv4.tcp_rmem = 4096 87380 536870912
net.ipv4.tcp_wmem = 4096 65536 536870912

# Backlog and queueing
net.core.netdev_max_backlog = 250000
net.core.default_qdisc = fq

# Useful general settings
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_window_scaling = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_sack = 1
net.ipv4.tcp_slow_start_after_idle = 0

# Congestion control (BBR is excellent if available)
net.ipv4.tcp_congestion_control = bbr

# Apply with 
sysctl --system

####################################################

3. System / Tuned Profile

dnf install tuned
tuned-adm profile network-throughput   # or throughput-performance

# Also set the CPU governor to performance (especially useful for high single-stream performance):
cpupower frequency-set -g performance

# 4. Other Important Checks

# Firmware and driver
# MTU to 9000
#IRQ Affinity  # Let irqbalance run, or pin manually to the NIC’s NUMA node   # Avoids cross-NUMA traffic
#Flow control  # Usually leave on (ethtool -A <iface> rx on tx on)  #  Helps under congestion
# offloads     # Keep TSO/GSO/GRO/checksumming on. Disable LRO if present  #  Modern offloads help a lot at 100G
# NUMA         # in your high-bandwidth applications to the same NUMA node as the NIC    #  Critical for max performance

# 5. Quick Verification Commands
# Ring buffers
ethtool -g <iface>

# Offloads
ethtool -k <iface>

# Coalescing
ethtool -c <iface>

# Drops / errors
ethtool -S <iface> | grep -E 'drop|error|miss|disc'

# Softnet backlog pressure
watch -n1 'cat /proc/net/softnet_stat'










